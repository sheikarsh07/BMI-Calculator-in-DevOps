apiVersion: apps/v1
kind: Deployment
metadata:
  name: bmi-calculator
  labels:
    app: bmi-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bmi-calculator
  template:
    metadata:
      labels:
        app: bmi-calculator
    spec:
      containers:
        - name: bmi-calculator
          image: localhost:5000/bmi-calculator:latest   # overridden by Terraform var
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
